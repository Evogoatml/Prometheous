[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheous"
version = "0.1.0"
description = "Polymorphic AI agent system with hot-reloadable cognitive control"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Evogoatml", email = "your-email@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "tensorflow>=2.13.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "qiskit>=0.39.0,<1.0.0",
    "openai>=1.0.0,<2.0.0",
    "anthropic>=0.18.0,<1.0.0",
    "groq>=0.4.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "colorama>=0.4.6,<1.0.0",
    "tqdm>=4.65.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.0.0",
]
